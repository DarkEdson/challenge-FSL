apiVersion: v1
kind: Service
metadata:
  name: fsl-challenge-headless
  namespace: production
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 80
  clusterIP: None
  selector:
    app: fsl-challenge
---
apiVersion: v1
kind: Service
metadata:
  name: fsl-challenge
  namespace: production
spec:
  type: NodePort
  ports:
  - name: http
    port: 8080
    targetPort: 80
    nodePort: 30080
  selector:
    app: fsl-challenge