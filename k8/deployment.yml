apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fsl-challenge
  namespace: production
spec:
  serviceName: fsl-challenge-headless
  replicas: 3
  selector:
    matchLabels:
      app: fsl-challenge
  template:
    metadata:
      labels:
        app: fsl-challenge
    spec:
      containers:
      - name: web
        image: fsl-challenge:local
        ports:
          - name: http
            containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"